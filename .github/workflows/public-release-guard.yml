name: Public release guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-release-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run prebuild
      - run: npm run test:unit
      - run: npm run typecheck

  db-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_DATABASE_URL: postgres://preppy:preppy@127.0.0.1:5432/preppy_test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      # pg_dump/pg_restore must match the server major version, so the
      # server image follows the client tools the runner image provides.
      - name: Start PostgreSQL matching the client tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client
          major=$(pg_dump --version | sed -E 's/.* ([0-9]+)(\.[0-9]+)*.*/\1/')
          echo "PostgreSQL client major: $major"
          docker run -d --name preppy-test-db -p 5432:5432 \
            -e POSTGRES_DB=preppy_test -e POSTGRES_USER=preppy \
            -e POSTGRES_PASSWORD=preppy "postgres:${major}-alpine"
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U preppy -d preppy_test; then
              exit 0
            fi
            sleep 2
          done
          docker logs preppy-test-db
          exit 1
      - run: npm ci --no-audit --no-fund
      - run: npm run test:db
