services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: admissionradar
      POSTGRES_USER: admissionradar
      POSTGRES_PASSWORD: admissionradar
    ports:
      - "55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admissionradar -d admissionradar"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - admissionradar_postgres:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro

volumes:
  admissionradar_postgres:
